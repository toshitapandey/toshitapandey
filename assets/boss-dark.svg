<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>.t{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-weight:800;fill:#eef2fa}.m{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#c9d3e6}.r{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-weight:800;fill:#c0392b}
.hp{animation:hp 6s ease-in-out infinite}@keyframes hp{0%{width:560px}70%,100%{width:40px}}
.shake{animation:sh .5s linear infinite}@keyframes sh{25%{transform:translateX(3px)}75%{transform:translateX(-3px)}}
.pop{animation:po 2s ease-in-out infinite}@keyframes po{50%{transform:scale(1.15)}}</style>
<rect width="900" height="260" rx="22" fill="#2d1a18" stroke="#f3c1b9" stroke-width="3"/>
<g class="shake" transform="translate(70,40)"><rect width="150" height="180" rx="26" fill="#25D366"/><circle cx="50" cy="70" r="14" fill="#ffffff"/><circle cx="100" cy="70" r="14" fill="#ffffff"/><circle cx="54" cy="74" r="6" fill="#16213b"/><circle cx="104" cy="74" r="6" fill="#16213b"/><path d="M40 125 q35 -25 70 0" stroke="#16213b" stroke-width="7" fill="none"/>
<g class="pop" style="transform-origin:140px 10px"><circle cx="140" cy="10" r="30" fill="#c0392b"/><text x="140" y="18" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="800" style="font-family:'Segoe UI',Helvetica,Arial,sans-serif">999+</text></g></g>
<text class="r" x="270" y="66" font-size="15" letter-spacing="3">FINAL BOSS</text>
<text class="t" x="270" y="104" font-size="30">The 400-message WhatsApp group</text>
<text class="m" x="270" y="134" font-size="16">Leads, orders and payments, all lost in one chat. Weakness: one proper system.</text>
<rect x="270" y="160" width="560" height="22" rx="11" fill="#4a2a26"/><rect class="hp" x="270" y="160" width="560" height="22" rx="11" fill="#c0392b"/>
<text class="m" x="270" y="212" font-size="15">HP draining as the team moves onto a CRM, a dashboard and one order screen.</text></svg>